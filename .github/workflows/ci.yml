name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: env/prober parse macOS tool output and use macOS-only behaviour.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
